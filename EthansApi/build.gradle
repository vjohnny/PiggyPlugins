plugins {
    id 'java'
}

dependencies {
    implementation 'org.json:json:20230227'
    implementation 'org.roaringbitmap:RoaringBitmap:0.9.44'
    // archive-patch-applier 1.0.4 was only published to JCenter. The jars in libs/
    // are that release (applier + its shared runtime dependency) so the build
    // still resolves after JCenter shut down.
    implementation files('libs/archive-patch-applier-1.0.4.jar', 'libs/archive-patch-shared-1.0.4.jar')
    implementation("org.benf:cfr:0.152")
}

sourceSets {

    main {

        java {
            srcDir "src"
        }

    }
}

group 'com.example'
version '1.0.0'

test {
    useJUnitPlatform()
}

task PiggyJar(type: Jar) {
    manifest {
        attributes 'Main-Class': 'com.example.Main'
    }
    archiveBaseName = 'ethan-api-standalone'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    with jar
}

tasks.register("prepareKotlinBuildScriptModel"){}